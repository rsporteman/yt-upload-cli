[package]
name = "yt-upload-cli"
version = "0.1.0"
edition = "2024"
description = "Upload videos to YouTube from the command line"
license = "MIT"
repository = "https://github.com/rsporteman/yt-upload-cli"
readme = "README.md"
keywords = ["youtube", "upload", "cli", "video"]
categories = ["command-line-utilities", "multimedia::video"]

[[bin]]
name = "yt-upload"
path = "src/main.rs"

[dependencies]
anyhow = "1.0.104"
clap = { version = "4.6.7", features = ["derive", "env"] }
dirs = "7.0.0"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "stream", "rustls"] }
serde_json = "1.0.154"
tokio = { version = "1.54.0", features = ["rt-multi-thread", "macros", "fs", "io-util"] }
webbrowser = "1.2.4"
yup-oauth2 = "12.1.2"

[dev-dependencies]
tempfile = "3.27.0"
wiremock = "0.6.5"
